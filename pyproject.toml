[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maplelens"
dynamic = ["version"]
description = "In-game overlays for MapleStory Classic: hover an item, see its MesoWatch price."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "cryptography>=42",
    "curl-cffi>=0.7",
    "opencv-python>=4.9",
    "pillow>=10",
    "mss>=9",
    "psutil>=5.9",
    "pywin32>=306",
    "rapidfuzz>=3.5",
    "winrt-runtime>=2.0",
    "winrt-Windows.Media.Ocr>=2.0",
    "winrt-Windows.Graphics.Imaging>=2.0",
    "winrt-Windows.Storage.Streams>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Foundation.Collections>=2.0",
    "winrt-Windows.Globalization>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.10"]

[project.scripts]
maplelens = "maplelens.cli:main"

[tool.hatch.version]
path = "src/maplelens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/maplelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
