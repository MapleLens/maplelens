# The phone notification relay (see src/index.js). Deploy: npx wrangler deploy (from this folder).
# First deploy and secrets: see README.md.
name = "maplelens-push"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# The site, and the test copy (`npx wrangler deploy --assets docs --name maplelens-preview` from the repo root).
ALLOWED_ORIGINS = "https://maplelens.github.io,https://maplelens-preview.prices-proxy.workers.dev"
VAPID_SUBJECT = "https://maplelens.github.io/maplelens/"

[[kv_namespaces]]
binding = "PAIRS"
id = "b1634704bf364755bb7af56484d654a7"

# Rate limits (Workers rate limiting: per Cloudflare location, periods of 10 or 60 s). See README.md.
# Every address, every POST: a player's page polls /status every 4 s while its QR code is up and sends a few messages.
[[ratelimits]]
name = "CLIENT_LIMIT"
namespace_id = "7303"
simple = { limit = 60, period = 60 }

# Per address: pairing and unpairing write KV (1,000 writes a day on the free plan).
[[ratelimits]]
name = "PAIR_LIMIT"
namespace_id = "7302"
simple = { limit = 5, period = 60 }

# Per pairing, for /notify and /status apart: MapleLens batches a burst of sales into one message.
[[ratelimits]]
name = "NOTIFY_LIMIT"
namespace_id = "7301"
simple = { limit = 20, period = 60 }

# Per pairing and route: MapleLens uploads at most every 5 s and checks in each minute; each phone app polls every 15 s.
[[ratelimits]]
name = "STATE_LIMIT"
namespace_id = "7304"
simple = { limit = 60, period = 60 }

# The sealed store state, one object per pairing (src/store.js). SQLite-backed: on the free plan.
[[durable_objects.bindings]]
name = "STORES"
class_name = "StoreState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreState"]
