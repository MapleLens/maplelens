# maple.observer and www.maple.observer redirect to the site (src/index.js). Deploy: npx wrangler deploy (from this folder).
name = "maplelens-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "maple.observer", custom_domain = true },
  { pattern = "www.maple.observer", custom_domain = true },
]
