version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # dtolnay/rust-toolchain's refs name Rust versions, not action versions: @1.88 is the minimum-Rust check
    # (rust-version in Cargo.toml) and must only move with it.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
