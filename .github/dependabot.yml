version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Actions are pinned to commit SHAs with the version in a comment, which Dependabot updates together.
    # dtolnay/rust-toolchain has no releases, only branches named after Rust versions: it is pinned to a commit of its
    # master (the toolchain is an input) and moved by hand.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
