name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR makes the running checks pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Swatinem/rust-cache puts every CARGO*/RUST* variable in its cache key: a change here is a cold build in every job.
# (release.yml builds without a cache: what it signs must not depend on anything a job here wrote.)
# Actions are pinned to full commit SHAs, the comment naming the version (Dependabot updates both).
env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless in CI and bloat the cache.
  CARGO_INCREMENTAL: 0
  # Debug info roughly doubles the test build's size and link time; a failing test still names its file and line.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

# Caching: each Rust job keeps its dependencies' build (and the registry) under its own shared-key, one per thing it
# builds (toolchain, target, profile), since no two jobs compile the same artefacts. rust-cache drops the workspace's
# own crates before saving, so a key only changes with Cargo.lock, a Cargo.toml, .cargo/config.toml or a new rustc.
# A run that restores its key exactly saves nothing; a pull request that changes the lock file saves its own copy (a
# second push to it is then warm) while main's stays the one every new branch starts from.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The release binary, checked against its pinned SHA-256, rather than a script fetched from a tag (which can move)
      # and run: a job on main can write the caches every other job here restores.
      - name: actionlint
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          ./actionlint -color

  deny:
    name: Dependencies (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A prebuilt binary: cargo-deny-action pulls a container image every run.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  lint:
    name: Clippy and docs
    # The Windows crate only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p maplelens-web --target wasm32-unknown-unknown --locked -- -D warnings
      # Reuses clippy's dependency metadata: only the workspace is documented.
      - run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests
    # The Windows app's tests open real windows and use the registry, Windows OCR and Graphics Capture.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
      # The updater's self-test runs target\release\maplelens.exe. Any build of the exe answers --version the same, so
      # the dev one (whose dependencies the tests share) stands in for a full LTO build; release.yml tests the real one.
      - run: cargo build -p maplelens --locked
      - name: Place the exe for the updater's self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/debug/maplelens.exe target/release/maplelens.exe
      - run: cargo test --workspace --locked

  msrv:
    name: Minimum Rust (1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          cache-on-failure: true
      - run: cargo check --workspace --all-targets --locked

  web:
    name: Web engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          cache-on-failure: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo build --release -p maplelens-web --target wasm32-unknown-unknown --locked
      - run: wasm-bindgen --target web --no-typescript --out-dir pkg target/wasm32-unknown-unknown/release/maplelens_web.wasm
      # GitHub Pages serves the committed engine. Its JavaScript glue only changes with the engine's API, so a
      # difference means docs/app/pkg was not rebuilt (scripts/build-web.ps1) after an API change.
      - name: docs/app/pkg matches the engine's API
        run: diff -u --strip-trailing-cr docs/app/pkg/maplelens_web.js pkg/maplelens_web.js
      - name: The web app's cache stamps are current (scripts/stamp-web.ps1)
        shell: pwsh
        run: |
          ./scripts/stamp-web.ps1
          git diff --ignore-cr-at-eol --exit-code -- docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-engine
          path: pkg/
          retention-days: 14

  relay:
    name: Push relay and vendored scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The relay's routes, crypto and abuse cases (relay/push/test), against in-memory Durable Objects.
      - run: npm test
        working-directory: relay/push
      # The self-hosted Tesseract and jsQR are byte for byte what scripts/vendor.mjs checked against npm's integrity.
      - run: node scripts/vendor.mjs --check
      # No page of the site loads a script from another server (they share one origin with the player's secrets).
      - name: No third-party scripts in the site
        run: |
          ! grep -rnE '<script[^>]+src="https?://|import\(\s*"https?://|\.src\s*=\s*"https?://' docs --include='*.html' --include='*.js' --exclude-dir=vendor --exclude-dir=pkg
