name: Release

# Push a tag like v0.2.0 (see scripts/bump-version.ps1) to build maplelens.exe and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# Exactly ci.yml's env block: rust-cache keys on every CARGO*/RUST* variable, and this job restores the cache CI's
# release-cache job saves on main.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # CI's release-cache job keeps this warm on main (a tag's own cache would reach no later run, so none is saved).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      - name: Check the tag matches the code version
        shell: bash
        run: |
          code_version=$(cargo pkgid -p maplelens | sed 's/.*[#@]//')
          if [ "v$code_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $code_version"; exit 1
          fi
          echo "VERSION=$code_version" >> "$GITHUB_ENV"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # (cargo-deny-action is a container action, which Windows runners cannot run.)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependencies (advisories, licences, sources)
        run: cargo deny --locked check

      - name: Build exe
        run: cargo build --release -p maplelens --locked
      # After the build: the updater's self-test runs this exe.
      - run: cargo test --workspace --locked

      - name: Smoke test the exe
        run: ./target/release/maplelens.exe --version

      - name: Package
        shell: pwsh
        run: |
          $name = "maplelens-v$env:VERSION-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/maplelens.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      # The in-app updater only trusts a manifest signed with the key behind update::PUBLIC_KEY; this fails the
      # release if the secret is missing or does not match it.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./target/release/maplelens.exe --sign-release "maplelens-v$env:VERSION-windows.zip"

      # The website's download: the same exe, installed per user (installer/maplelens.iss), with its .sha256. The
      # updater keeps using the zip above.
      - name: Installer
        shell: pwsh
        run: |
          $setup = ./scripts/build-installer.ps1 -Version $env:VERSION -Install
          ./scripts/test-installer.ps1 $setup

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maplelens-v${{ env.VERSION }}-windows.zip
            maplelens-v${{ env.VERSION }}-windows.zip.sha256
            maplelens-v${{ env.VERSION }}-setup.exe
            maplelens-v${{ env.VERSION }}-setup.exe.sha256
            maplelens-v${{ env.VERSION }}-manifest.json
            maplelens-v${{ env.VERSION }}-manifest.json.sig
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
