name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Remember MapleLens only reads screen pixels (no injection, memory reading or input automation).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
